<!DOCTYPE html>

<html>
    <head>
        <title>Contact</title>
        <link rel="stylesheet" href="./travel_recommendation.css">
    </head>
    <body>
        <div id="navbar"></div>

        <div class="general">
            <div class="contactContainer">
                <h1>CONTACT US</h1>
                <p>
                    Get in touch! <br>
                    Fill out the form below and <br>
                    we'll get back to you.
                </p>
            </div>
            
            <div>
                <form id="contactForm" class="contactForm">
                    <div class="formRow">
                        <div class="formGroup">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName">
                        </div>

                        <div class="formGroup">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName">
                        </div>
                    </div>

                    <div class="formGroup">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email">
                    </div>

                    <div class="formGroup">
                        <label for="message">Message</label>
                        <textarea id="message" name="message"></textarea>
                    </div>

                    <button type="submit" class="submitBtn" id="submitBtn">Submit</button>
                </form>
            </div>

            <div>
                <ul class="iconList">
                    <li><img src="icons/twitter.png"></li>
                    <li><img src="icons/facebook.png"></li>
                    <li><img src="icons/instagram.png"></li>
                    <li><img src="icons/youtube.png"></li>
                </ul>
            </div>
        </div>

        <script>
            fetch("navbar_no_search.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("navbar").innerHTML = data;
                });
        </script>
    </body>
</html>
